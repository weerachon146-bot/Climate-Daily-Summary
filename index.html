<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Daily Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #eef2ff; margin: 0; padding: 30px; display: flex; justify-content: center; }
        .app { width: 900px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #4f46e5; }
        #dateRange { font-weight: bold; color: #4f46e5; background: #f0f9ff; padding: 10px; border-radius: 8px; }
        .panel { margin-top: 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .box { background: #f8fafc; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .value { font-size: 20px; font-weight: bold; }
        .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .chart-container { height: 250px; }
        button { cursor: pointer; background: #4f46e5; color: white; border: none; padding: 5px 15px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app">
    <h1>Climate Daily Summary</h1>
    <p id="dateRange">กำลังโหลดข้อมูลจาก GitHub...</p>

    <div class="panel">
        <label>เลือกวันที่</label>
        <input type="date" id="targetDate">
        <button onclick="processDailyData()">แสดงผล</button>
    </div>

    <div class="stats">
        <div class="box"><div>อุณหภูมิเฉลี่ย</div><div id="temp" class="value">-</div></div>
        <div class="box"><div>ความชื้นเฉลี่ย</div><div id="humid" class="value">-</div></div>
        <div class="box"><div>VPD เฉลี่ย</div><div id="vpd" class="value">-</div></div>
        <div class="box"><div>ปริมาณฝนรวม</div><div id="rain" class="value">-</div></div>
    </div>

    <div class="charts">
        <div class="chart-container"><canvas id="chartTemp"></canvas></div>
        <div class="chart-container"><canvas id="chartHumid"></canvas></div>
        <div class="chart-container"><canvas id="chartVpd"></canvas></div>
        <div class="chart-container"><canvas id="chartRain"></canvas></div>
    </div>
</div>

<script>
let db = [];
let charts = {};
const files = ["data/2023.html", "data/2024.html", "data/2025.html", "data/2026.html"];

window.onload = async function() {
    const statusEl = document.getElementById("dateRange");
    try {
        for (const file of files) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue; // ข้ามไฟล์ที่หาไม่พบ
                const text = await res.text();
                parseData(text);
            } catch (e) {
                console.error("ไม่สามารถโหลดไฟล์:", file);
            }
        }

        if (db.length === 0) {
            statusEl.innerText = "❌ ไม่พบข้อมูลในโฟลเดอร์ data/ ตรวจสอบชื่อไฟล์และตัวอักษรเล็ก-ใหญ่";
            statusEl.style.color = "red";
        } else {
            showDateRange();
        }
    } catch (err) {
        statusEl.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล";
    }
};

function parseData(content) {
    const doc = new DOMParser().parseFromString(content, 'text/html');
    const rows = doc.querySelectorAll("tr");
    rows.forEach(tr => {
        const td = tr.querySelectorAll("td");
        // ตรวจสอบรูปแบบวันที่ YYYY-MM-DD
        if (td.length >= 5 && /^\d{4}-\d{2}-\d{2}/.test(td[0].textContent.trim())) {
            db.push({
                date: td[0].textContent.trim().split(" ")[0],
                temp: parseFloat(td[1].textContent) || 0,
                vpd: parseFloat(td[2].textContent) || 0,
                humid: parseFloat(td[3].textContent) || 0,
                rain: parseFloat(td[4].textContent) || 0
            });
        }
    });
}

function showDateRange() {
    const dates = db.map(d => d.date).sort();
    const first = dates[0];
    const last = dates[dates.length - 1];
    
    document.getElementById("targetDate").min = first;
    document.getElementById("targetDate").max = last;
    document.getElementById("targetDate").value = last;
    
    document.getElementById("dateRange").innerText = "ช่วงข้อมูลทั้งหมด: " + first + " ถึง " + last;
    processDailyData(); // แสดงผลวันล่าสุดทันที
}

function processDailyData() {
    const date = document.getElementById("targetDate").value;
    if (!date) return alert("กรุณาเลือกวันที่");

    const data = db.filter(d => d.date === date);
    if (data.length === 0) return alert("ไม่พบข้อมูลของวันที่ " + date);

    const avgTemp = (data.reduce((a, b) => a + b.temp, 0) / data.length).toFixed(1);
    const avgHumid = (data.reduce((a, b) => a + b.humid, 0) / data.length).toFixed(1);
    const avgVpd = (data.reduce((a, b) => a + b.vpd, 0) / data.length).toFixed(2);
    const sumRain = (data.reduce((a, b) => a + b.rain, 0)).toFixed(1);

    document.getElementById("temp").innerText = avgTemp + " °C";
    document.getElementById("humid").innerText = avgHumid + " %";
    document.getElementById("vpd").innerText = avgVpd + " kPa";
    document.getElementById("rain").innerText = sumRain + " mm";

    renderChart("chartTemp", "อุณหภูมิ (°C)", avgTemp, "#f87171");
    renderChart("chartHumid", "ความชื้น (%)", avgHumid, "#60a5fa");
    renderChart("chartVpd", "VPD (kPa)", avgVpd, "#fbbf24");
    renderChart("chartRain", "ปริมาณฝน (mm)", sumRain, "#34d399");
}

function renderChart(id, label, value, color) {
    const ctx = document.getElementById(id).getContext("2d");
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(ctx, {
        type: "bar",
        data: {
            labels: [label],
            datasets: [{ data: [value], backgroundColor: color }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });
}
</script>
</body>
</html>
