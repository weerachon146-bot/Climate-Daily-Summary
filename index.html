<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Daily Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2ff; margin: 0; padding: 30px; display: flex; justify-content: center; }
        .app { width: 900px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #4f46e5; }
        #dateRange { font-weight: bold; color: #6366f1; background: #f0f9ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .panel { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 12px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .box { background: #ffffff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; text-align: center; }
        .value { font-size: 20px; font-weight: bold; color: #1e293b; margin-top: 5px; }
        .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }
        .chart-container { height: 250px; background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div class="app">
    <h1>Climate Daily Summary</h1>
    <p id="dateRange">กำลังตรวจสอบการเชื่อมต่อข้อมูล...</p>

    <div class="panel">
        <label>เลือกวันที่: </label>
        <input type="date" id="targetDate">
        <button onclick="processDailyData()" style="cursor:pointer; padding: 5px 15px; background: #4f46e5; color: white; border: none; border-radius: 5px;">แสดงผล</button>
    </div>

    <div class="stats">
        <div class="box"><div>อุณหภูมิเฉลี่ย</div><div id="temp" class="value">-</div></div>
        <div class="box"><div>ความชื้นเฉลี่ย</div><div id="humid" class="value">-</div></div>
        <div class="box"><div>VPD เฉลี่ย</div><div id="vpd" class="value">-</div></div>
        <div class="box"><div>ปริมาณฝนรวม</div><div id="rain" class="value">-</div></div>
    </div>

    <div class="charts">
        <div class="chart-container"><canvas id="chartTemp"></canvas></div>
        <div class="chart-container"><canvas id="chartHumid"></canvas></div>
        <div class="chart-container"><canvas id="chartVpd"></canvas></div>
        <div class="chart-container"><canvas id="chartRain"></canvas></div>
    </div>
</div>

<script>
let db = [];
let charts = {};
const files = ["data/2023.html", "data/2024.html", "data/2025.html", "data/2026.html"];

window.onload = async function() {
    const statusEl = document.getElementById("dateRange");
    try {
        for (const file of files) {
            try {
                const res = await fetch(file);
                if (res.ok) {
                    const text = await res.text();
                    parseData(text);
                }
            } catch (e) {
                console.warn(`ไม่พบไฟล์หรือโหลดไฟล์ไม่ได้: ${file}`);
            }
        }

        if (db.length === 0) {
            statusEl.innerText = "⚠️ ไม่พบข้อมูลในระบบ (กรุณารันผ่าน Web Server เช่น Live Server)";
            statusEl.style.color = "red";
        } else {
            showDateRange();
        }
    } catch (err) {
        statusEl.innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
        console.error(err);
    }
};

function parseData(content) {
    const doc = new DOMParser().parseFromString(content, 'text/html');
    const rows = doc.querySelectorAll("tr");
    rows.forEach(tr => {
        const td = tr.querySelectorAll("td");
        // ตรวจสอบว่าคอลัมน์แรกเป็นวันที่ (YYYY-MM-DD)
        if (td.length >= 5 && /^\d{4}-\d{2}-\d{2}/.test(td[0].textContent.trim())) {
            db.push({
                date: td[0].textContent.trim().split(" ")[0],
                temp: parseFloat(td[1].textContent) || 0,
                vpd: parseFloat(td[2].textContent) || 0,
                humid: parseFloat(td[3].textContent) || 0,
                rain: parseFloat(td[4].textContent) || 0
            });
        }
    });
}
