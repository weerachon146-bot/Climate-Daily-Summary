<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Daily Summary</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
background:#4a4370;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
border-radius:15px;
width:750px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.cards{
display:flex;
gap:10px;
margin-top:15px;
}

.card{
flex:1;
background:#eee;
padding:10px;
border-radius:10px;
text-align:center;
}

button{
background:#2b6cff;
color:white;
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
}

.chart{
margin-top:20px;
}

.year-range{
margin-top:10px;
font-size:14px;
color:#555;
}

</style>

</head>

<body>

<div class="container">

<h2>กำลังโหลดข้อมูล...</h2>

เลือกวันที่
<input type="date" id="date">

<button onclick="showData()">แสดงผล</button>

<div class="year-range" id="range"></div>

<div class="cards">

<div class="card">
อุณหภูมิเฉลี่ย
<div id="temp">-</div>
</div>

<div class="card">
ความชื้นเฉลี่ย
<div id="hum">-</div>
</div>

<div class="card">
VPD เฉลี่ย
<div id="vpd">-</div>
</div>

<div class="card">
ปริมาณฝนรวม
<div id="rain">-</div>
</div>

</div>

<div class="chart">
<canvas id="chart"></canvas>
</div>

<br>

<button onclick="hourPage()">ดูข้อมูลรายชั่วโมง</button>

</div>

<script>

let chart;

async function loadYear(year){

let res = await fetch(`data/${year}.html`);
let text = await res.text();

let lines = text.split("\n");

let data=[];

lines.forEach(l=>{
if(l.includes("-") && l.includes(":")){
data.push(l.trim());
}
});

return data;

}

async function showData(){

let date=document.getElementById("date").value;

if(!date){
alert("เลือกวันที่ก่อน");
return;
}

let year=date.substring(0,4);

let data=await loadYear(year);

let day=data.filter(d=>d.includes(date));

if(day.length==0){
alert("ไม่พบข้อมูล");
return;
}

let temp=0;
let hum=0;
let vpd=0;
let rain=0;

let hours=[];
let temps=[];

day.forEach(l=>{

let p=l.split(/\s+/);

temp+=parseFloat(p[2]);
vpd+=parseFloat(p[3]);
hum+=parseFloat(p[4]);
rain+=parseFloat(p[5]);

hours.push(p[1].substring(0,5));
temps.push(parseFloat(p[2]));

});

let n=day.length;

document.getElementById("temp").innerHTML=(temp/n).toFixed(2)+" °C";
document.getElementById("hum").innerHTML=(hum/n).toFixed(2)+" %";
document.getElementById("vpd").innerHTML=(vpd/n).toFixed(2);
document.getElementById("rain").innerHTML=rain.toFixed(2)+" mm";

document.getElementById("range").innerHTML=
`ข้อมูลปี ${year} : 1 ม.ค. ${year} - 31 ธ.ค. ${year}`;

drawChart(hours,temps);

}

function drawChart(h,t){

if(chart) chart.destroy();

chart=new Chart(
document.getElementById("chart"),
{
type:"line",
data:{
labels:h,
datasets:[{
label:"อุณหภูมิ °C",
data:t
}]
},
options:{
responsive:true
}
}
);

}

function hourPage(){

let date=document.getElementById("date").value;

if(!date){
alert("เลือกวันที่ก่อน");
return;
}

window.open(`new1.html?date=${date}`,"_blank");

}

</script>

</body>
</html>
