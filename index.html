<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Climate Daily Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #eef2ff; padding: 30px; display: flex; justify-content: center; }
        .app { width: 900px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .box { background: #f8fafc; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .value { font-size: 20px; font-weight: bold; }
        .chart-container { height: 250px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="app">
    <h1>Climate Daily Summary</h1>
    <div id="status">กำลังอ่านข้อมูล...</div>
    <input type="date" id="targetDate">
    <button onclick="processDailyData()">แสดงผล</button>

    <div class="stats">
        <div class="box">อุณหภูมิ<div id="temp" class="value">-</div></div>
        <div class="box">ความชื้น<div id="humid" class="value">-</div></div>
        <div class="box">VPD<div id="vpd" class="value">-</div></div>
        <div class="box">ฝนรวม<div id="rain" class="value">-</div></div>
    </div>
    <div class="chart-container"><canvas id="chartTemp"></canvas></div>
</div>

<script>
let db = [];
let charts = {};
const files = ["data/2023.html", "data/2024.html", "data/2025.html", "data/2026.html"];

window.onload = async function() {
    for (const file of files) {
        try {
            const res = await fetch(file);
            if (!res.ok) continue;
            const text = await res.text();
            parseData(text);
        } catch (e) { console.error("โหลดไฟล์พลาด:", file); }
    }
    if (db.length > 0) {
        document.getElementById("status").innerText = "โหลดข้อมูลสำเร็จ";
        processDailyData();
    }
};

function parseData(content) {
    const lines = content.split('\n');
    lines.forEach(line => {
        // ดึงค่าตาม Pattern ที่เห็นในรูป: YYYY-MM-DD HH:mm:ss  Temp  VPD  Humid  Rain
        const match = line.match(/(\d{4}-\d{2}-\d{2})\s\d{2}:\d{2}:\d{2}\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
        if (match) {
            db.push({
                date: match[1],
                temp: parseFloat(match[2]),
                vpd: parseFloat(match[3]),
                humid: parseFloat(match[4]),
                rain: parseFloat(match[5])
            });
        }
    });
}

function processDailyData() {
    const target = document.getElementById("targetDate").value || db[0]?.date;
    const data = db.filter(d => d.date === target);
    if (data.length === 0) return;

    const avgTemp = (data.reduce((a, b) => a + b.temp, 0) / data.length).toFixed(1);
    document.getElementById("temp").innerText = avgTemp + " °C";
    // เพิ่มคำสั่งแสดงค่าอื่นๆ ตามโครงสร้างเดียวกัน...
}
</script>
</body>
</html>
