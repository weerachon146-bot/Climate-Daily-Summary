<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Daily Summary</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
background:#eef2ff;
margin:0;
padding:30px;
display:flex;
justify-content:center;
}

.app{
width:900px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
margin-top:0;
color:#4f46e5;
}

#dateRange{
font-weight:bold;
color:#4f46e5;
}

.panel{
margin-top:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:20px;
}

.box{
background:#f8fafc;
padding:15px;
border-radius:12px;
text-align:center;
}

.value{
font-size:20px;
font-weight:bold;
}

.charts{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:30px;
}

.chart{
height:250px;
}

</style>

</head>

<body>

<div class="app">

<h1>Climate Daily Summary</h1>

<p id="dateRange">กำลังโหลดข้อมูล...</p>

<div class="panel">

<label>เลือกวันที่</label>

<input type="date" id="targetDate">

<button onclick="processDailyData()">แสดงผล</button>

</div>

<div class="stats">

<div class="box">
<div>อุณหภูมิเฉลี่ย</div>
<div id="temp" class="value">-</div>
</div>

<div class="box">
<div>ความชื้นเฉลี่ย</div>
<div id="humid" class="value">-</div>
</div>

<div class="box">
<div>VPD เฉลี่ย</div>
<div id="vpd" class="value">-</div>
</div>

<div class="box">
<div>ปริมาณฝนรวม</div>
<div id="rain" class="value">-</div>
</div>

</div>

<div class="charts">

<canvas id="chartTemp" class="chart"></canvas>
<canvas id="chartHumid" class="chart"></canvas>
<canvas id="chartVpd" class="chart"></canvas>
<canvas id="chartRain" class="chart"></canvas>

</div>

</div>

<script>

let db=[];
let charts={};

const files=[
"data/2023.html",
"data/2024.html",
"data/2025.html",
"data/2026.html"
];

window.onload=async function(){

for(const file of files){

const res=await fetch(file);
const text=await res.text();

parseData(text);

}

showDateRange();

};

function parseData(content){

const doc=new DOMParser().parseFromString(content,'text/html');

const rows=doc.querySelectorAll("tr");

rows.forEach(tr=>{

const td=tr.querySelectorAll("td");

if(td.length>=5 && /^\d{4}-\d{2}-\d{2}/.test(td[0].textContent)){

db.push({

date:td[0].textContent.split(" ")[0],
temp:parseFloat(td[1].textContent)||0,
vpd:parseFloat(td[2].textContent)||0,
humid:parseFloat(td[3].textContent)||0,
rain:parseFloat(td[4].textContent)||0

});

}

});

}

function showDateRange(){

if(db.length===0)return;

const dates=db.map(d=>d.date).sort();

const first=dates[0];
const last=dates[dates.length-1];

document.getElementById("targetDate").min=first;
document.getElementById("targetDate").max=last;

document.getElementById("dateRange").innerText=
"ช่วงข้อมูลทั้งหมด : "+first+" ถึง "+last;

}

function processDailyData(){

const date=document.getElementById("targetDate").value;

if(!date){
alert("กรุณาเลือกวันที่");
return;
}

const data=db.filter(d=>d.date===date);

if(data.length===0){
alert("ไม่พบข้อมูล");
return;
}

const avgTemp=(data.reduce((a,b)=>a+b.temp,0)/data.length).toFixed(1);
const avgHumid=(data.reduce((a,b)=>a+b.humid,0)/data.length).toFixed(1);
const avgVpd=(data.reduce((a,b)=>a+b.vpd,0)/data.length).toFixed(2);
const sumRain=(data.reduce((a,b)=>a+b.rain,0)).toFixed(1);

document.getElementById("temp").innerText=avgTemp+" °C";
document.getElementById("humid").innerText=avgHumid+" %";
document.getElementById("vpd").innerText=avgVpd+" kPa";
document.getElementById("rain").innerText=sumRain+" mm";

renderChart("chartTemp","Temp",avgTemp);
renderChart("chartHumid","Humidity",avgHumid);
renderChart("chartVpd","VPD",avgVpd);
renderChart("chartRain","Rain",sumRain);

}

function renderChart(id,label,value){

const ctx=document.getElementById(id).getContext("2d");

if(charts[id])charts[id].destroy();

charts[id]=new Chart(ctx,{

type:"bar",

data:{
labels:[label],
datasets:[{data:[value]}]
},

options:{
responsive:true,
plugins:{legend:{display:false}},
scales:{y:{beginAtZero:true}}

}

});

}

</script>

</body>
</html>
