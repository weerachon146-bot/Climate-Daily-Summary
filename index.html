<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Daily Summary</title>

<style>
body{
font-family: Arial, sans-serif;
background:#4a3f72;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:15px;
width:700px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
margin-top:0;
}

input{
padding:5px;
}

button{
padding:6px 12px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.cards{
display:flex;
gap:10px;
margin-top:20px;
}

.card{
flex:1;
background:#f0f0f0;
padding:15px;
border-radius:10px;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h2>กำลังโหลดข้อมูล...</h2>

เลือกวันที่
<input type="date" id="date">
<button onclick="showData()">แสดงผล</button>

<div class="cards">
<div class="card">
อุณหภูมิเฉลี่ย<br>
<span id="temp">-</span>
</div>

<div class="card">
ความชื้นเฉลี่ย<br>
<span id="hum">-</span>
</div>

<div class="card">
VPD เฉลี่ย<br>
<span id="vpd">-</span>
</div>

<div class="card">
ปริมาณฝนรวม<br>
<span id="rain">-</span>
</div>
</div>

</div>

<script>

async function loadAllData(){

const files=[
"data/2023.html",
"data/2024.html",
"data/2025.html",
"data/2026.html"
];

let allData=[];

for(const file of files){

try{

let res=await fetch(file);
let text=await res.text();

let lines=text.split("\n");

lines.forEach(line=>{
if(line.includes("-") && line.includes(":")){
allData.push(line.trim());
}
});

}catch(e){
console.log("error loading",file);
}

}

return allData;

}

async function showData(){

let date=document.getElementById("date").value;

if(!date){
alert("กรุณาเลือกวันที่");
return;
}

let data=await loadAllData();

let dayData=data.filter(line=>line.includes(date));

if(dayData.length==0){
alert("ไม่พบข้อมูล");
return;
}

let temp=0;
let hum=0;
let vpd=0;
let rain=0;

dayData.forEach(line=>{

let p=line.split(/\s+/);

temp+=parseFloat(p[2]);
vpd+=parseFloat(p[3]);
hum+=parseFloat(p[4]);
rain+=parseFloat(p[5]);

});

let n=dayData.length;

document.getElementById("temp").innerText=(temp/n).toFixed(2)+" °C";
document.getElementById("hum").innerText=(hum/n).toFixed(2)+" %";
document.getElementById("vpd").innerText=(vpd/n).toFixed(2);
document.getElementById("rain").innerText=rain.toFixed(2)+" mm";

}

</script>

</body>
</html>
