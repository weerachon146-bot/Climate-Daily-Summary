<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Daily Summary</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: "Sarabun", sans-serif;
background: linear-gradient(135deg,#5f72bd,#9b23ea);
margin:0;
padding:0;
display:flex;
justify-content:center;
}

.container{
background:white;
width:1100px;
margin-top:40px;
padding:25px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

button{
background:#6c5ce7;
color:white;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#4834d4;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.card{
background:#f2f2f2;
padding:10px;
text-align:center;
border-radius:8px;
}

.chart-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.chart-box{
height:250px;
}

canvas{
max-height:250px;
}

.link{
margin-top:20px;
text-align:center;
}

a{
text-decoration:none;
color:white;
background:#00a8ff;
padding:10px 20px;
border-radius:6px;
}

</style>
</head>

<body>

<div class="container">

<h1>Climate Daily Summary</h1>

<div class="topbar">

<div>
เลือกวันที่
<input type="date">
<button>แสดงผล</button>
</div>

</div>

<div class="stats">

<div class="card">
<p>อุณหภูมิเฉลี่ย</p>
<h3>26.8 °C</h3>
</div>

<div class="card">
<p>ความชื้นเฉลี่ย</p>
<h3>91.5 %</h3>
</div>

<div class="card">
<p>VPD เฉลี่ย</p>
<h3>0.42 kPa</h3>
</div>

<div class="card">
<p>ปริมาณฝนรวม</p>
<h3>0.0 mm</h3>
</div>

</div>

<div class="chart-grid">

<div class="chart-box">
<canvas id="tempChart"></canvas>
</div>

<div class="chart-box">
<canvas id="humChart"></canvas>
</div>

<div class="chart-box">
<canvas id="vpdChart"></canvas>
</div>

<div class="chart-box">
<canvas id="rainChart"></canvas>
</div>

</div>

<div class="link">
<a href="hourly.html">ดูข้อมูลรายชั่วโมง</a>
</div>

</div>

<script>

new Chart(document.getElementById("tempChart"),{
type:"bar",
data:{
labels:["Temp"],
datasets:[{
label:"Temperature",
data:[26.8],
backgroundColor:"#ff4757"
}]
},
options:{responsive:true,maintainAspectRatio:false}
})

new Chart(document.getElementById("humChart"),{
type:"bar",
data:{
labels:["Humidity"],
datasets:[{
label:"Humidity",
data:[91.5],
backgroundColor:"#1e90ff"
}]
},
options:{responsive:true,maintainAspectRatio:false}
})

new Chart(document.getElementById("vpdChart"),{
type:"bar",
data:{
labels:["VPD"],
datasets:[{
label:"VPD",
data:[0.42],
backgroundColor:"#ffa502"
}]
},
options:{responsive:true,maintainAspectRatio:false}
})

new Chart(document.getElementById("rainChart"),{
type:"bar",
data:{
labels:["Rain"],
datasets:[{
label:"Rainfall",
data:[0],
backgroundColor:"#2ed573"
}]
},
options:{responsive:true,maintainAspectRatio:false}
})

</script>

</body>
</html>
