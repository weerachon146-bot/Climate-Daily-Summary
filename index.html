<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Daily Summary</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial;
background:#e9edf5;
margin:0;
padding:40px;
}

.container{
background:white;
padding:25px;
border-radius:12px;
max-width:1100px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
color:#3b5cff;
margin-bottom:10px;
}

.info{
margin-bottom:20px;
font-size:14px;
color:#444;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.card{
background:#f2f4f8;
padding:15px;
border-radius:10px;
text-align:center;
}

.card h3{
margin:0;
font-size:14px;
color:#555;
}

.card p{
font-size:20px;
margin:5px 0 0;
font-weight:bold;
}

.charts{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

canvas{
background:#fff;
padding:10px;
border-radius:8px;
}

button{
margin-top:20px;
padding:10px 18px;
border:none;
background:#3b5cff;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2c47d9;
}

</style>
</head>

<body>

<div class="container">

<h1>Climate Daily Summary</h1>

<div class="info">
ช่วงข้อมูลทั้งหมด : <span id="range">กำลังโหลด...</span>
</div>

<input type="date" id="datePicker">

<div class="cards">

<div class="card">
<h3>อุณหภูมิเฉลี่ย</h3>
<p id="temp">--</p>
</div>

<div class="card">
<h3>ความชื้นเฉลี่ย</h3>
<p id="humid">--</p>
</div>

<div class="card">
<h3>VPD เฉลี่ย</h3>
<p id="vpd">--</p>
</div>

<div class="card">
<h3>ปริมาณฝนรวม</h3>
<p id="rain">--</p>
</div>

</div>

<div class="charts">

<canvas id="chartTemp"></canvas>
<canvas id="chartHumid"></canvas>
<canvas id="chartVpd"></canvas>
<canvas id="chartRain"></canvas>

</div>

<a href="new1.html">
<button>ดูข้อมูลรายชั่วโมง</button>
</a>

</div>

<script>

let db=[];

async function loadData(){

const files=["2023.html","2024.html","2025.html","2026.html"];

for(const file of files){

try{

const res=await fetch(file);
const text=await res.text();

parseData(text);

}catch(e){
console.log("โหลดไม่ได้",file);
}

}

init();

}

function parseData(content){

const lines=content.split("\n");

lines.forEach(line=>{

line=line.trim();

if(line.match(/^\\d{4}-\\d{2}-\\d{2}/)){

const p=line.split(/\\s+/);

db.push({

date:p[0],
time:p[1],
temp:parseFloat(p[2])||0,
vpd:parseFloat(p[3])||0,
humid:parseFloat(p[4])||0,
rain:parseFloat(p[5])||0

});

}

});

}

let chartTemp,chartHumid,chartVpd,chartRain;

function init(){

db.sort((a,b)=> new Date(a.date+" "+a.time)-new Date(b.date+" "+b.time));

const start=db[0].date;
const end=db[db.length-1].date;

document.getElementById("range").innerText=start+" ถึง "+end;

document.getElementById("datePicker").value=start;

createCharts();

updateDay(start);

document.getElementById("datePicker").addEventListener("change",e=>{
updateDay(e.target.value);
});

}

function createCharts(){

chartTemp=new Chart(document.getElementById("chartTemp"),{
type:"bar",
data:{labels:["Temp"],datasets:[{label:"Temp",data:[0]}]}
});

chartHumid=new Chart(document.getElementById("chartHumid"),{
type:"bar",
data:{labels:["Humidity"],datasets:[{label:"Humidity",data:[0]}]}
});

chartVpd=new Chart(document.getElementById("chartVpd"),{
type:"bar",
data:{labels:["VPD"],datasets:[{label:"VPD",data:[0]}]}
});

chartRain=new Chart(document.getElementById("chartRain"),{
type:"bar",
data:{labels:["Rain"],datasets:[{label:"Rain",data:[0]}]}
});

}

function updateDay(date){

const day=db.filter(d=>d.date===date);

if(day.length==0)return;

let t=0,h=0,v=0,r=0;

day.forEach(d=>{
t+=d.temp;
h+=d.humid;
v+=d.vpd;
r+=d.rain;
});

t/=day.length;
h/=day.length;
v/=day.length;

document.getElementById("temp").innerText=t.toFixed(1)+" °C";
document.getElementById("humid").innerText=h.toFixed(1)+" %";
document.getElementById("vpd").innerText=v.toFixed(2)+" kPa";
document.getElementById("rain").innerText=r.toFixed(1)+" mm";

chartTemp.data.datasets[0].data=[t];
chartHumid.data.datasets[0].data=[h];
chartVpd.data.datasets[0].data=[v];
chartRain.data.datasets[0].data=[r];

chartTemp.update();
chartHumid.update();
chartVpd.update();
chartRain.update();

}

loadData();

</script>

</body>
</html>
