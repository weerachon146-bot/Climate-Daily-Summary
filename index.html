<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Climate Daily Summary</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:sans-serif;
background:#544a7d;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:white;
padding:25px;
border-radius:15px;
width:900px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
text-align:center;
margin-bottom:5px;
}

.info{
text-align:center;
margin-bottom:15px;
font-size:14px;
color:#555;
}

.cards{
display:flex;
gap:10px;
margin-top:15px;
}

.card{
flex:1;
background:#eee;
padding:10px;
border-radius:10px;
text-align:center;
}

.chartBox{
margin-top:25px;
}

button{
background:#2d6cdf;
color:white;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>ข้อมูลสภาพอากาศ</h1>

<div class="info" id="rangeInfo">
-
</div>

เลือกวันที่
<input type="date" id="date">
<button onclick="showData()">แสดงผล</button>

<div class="cards">

<div class="card">
อุณหภูมิเฉลี่ย
<div id="temp">-</div>
</div>

<div class="card">
ความชื้นเฉลี่ย
<div id="hum">-</div>
</div>

<div class="card">
VPD เฉลี่ย
<div id="vpd">-</div>
</div>

<div class="card">
ปริมาณฝนรวม
<div id="rain">-</div>
</div>

</div>

<div class="chartBox">
<canvas id="tempChart"></canvas>
</div>

<div class="chartBox">
<canvas id="humChart"></canvas>
</div>

<div class="chartBox">
<canvas id="vpdChart"></canvas>
</div>

<div class="chartBox">
<canvas id="rainChart"></canvas>
</div>

<br>

<button onclick="hourPage()">ดูข้อมูลรายชั่วโมง</button>

</div>

<script>

let tempChart,humChart,vpdChart,rainChart;

async function loadYear(year){

let res=await fetch(`data/${year}.html`);
let text=await res.text();

let lines=text.split("\n");

let data=[];

lines.forEach(l=>{
if(l.includes("-") && l.includes(":")){
data.push(l.trim());
}
});

updateRange(year,data);

return data;

}

function updateRange(year,data){

let first=data[data.length-1];
let last=data[0];

let start=first.split(" ")[0];
let end=last.split(" ")[0];

document.getElementById("rangeInfo").innerHTML=
`ข้อมูลปี ${year} | ช่วงข้อมูล: ${start} - ${end}`;

}

async function showData(){

let date=document.getElementById("date").value;
let year=date.substring(0,4);

let data=await loadYear(year);

let day=data.filter(d=>d.includes(date));

let temp=0;
let hum=0;
let vpd=0;
let rain=0;

let hours=[];
let temps=[];
let hums=[];
let vpds=[];
let rains=[];

day.forEach(l=>{

let p=l.split(/\s+/);

let t=parseFloat(p[2]);
let v=parseFloat(p[3]);
let h=parseFloat(p[4]);
let r=parseFloat(p[5]);

temp+=t;
vpd+=v;
hum+=h;
rain+=r;

hours.push(p[1].substring(0,5));

temps.push(t);
hums.push(h);
vpds.push(v);
rains.push(r);

});

let n=day.length;

document.getElementById("temp").innerHTML=(temp/n).toFixed(2)+" °C";
document.getElementById("hum").innerHTML=(hum/n).toFixed(2)+" %RH";
document.getElementById("vpd").innerHTML=(vpd/n).toFixed(2);
document.getElementById("rain").innerHTML=rain.toFixed(2)+" mm";

drawChart("tempChart","Temperature °C",hours,temps);
drawChart("humChart","Humidity %RH",hours,hums);
drawChart("vpdChart","VPD",hours,vpds);
drawChart("rainChart","Rain mm",hours,rains);

}

function drawChart(id,label,x,y){

let ctx=document.getElementById(id);

if(ctx.chart){
ctx.chart.destroy();
}

ctx.chart=new Chart(ctx,{
type:"line",
data:{
labels:x,
datasets:[{
label:label,
data:y,
borderWidth:2,
fill:false
}]
},
options:{
responsive:true
}
});

}

function hourPage(){

let date=document.getElementById("date").value;

window.open(`new1.html?date=${date}`,"_blank");

}

</script>

</body>
</html>
