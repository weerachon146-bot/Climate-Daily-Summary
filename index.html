<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Daily Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #eef2ff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 900px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #4f46e5; margin-bottom: 20px; }
        #status { background: #f0f9ff; padding: 10px; border-radius: 8px; color: #6366f1; font-weight: bold; margin-bottom: 15px; }
        .panel { background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .box { background: white; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; text-align: center; }
        .value { font-size: 22px; font-weight: bold; color: #1e293b; margin-top: 5px; }
        .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-top: 25px; }
        .chart-container { background: white; padding: 15px; border-radius: 15px; border: 1px solid #f1f5f9; height: 300px; }
        button { cursor: pointer; padding: 8px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; transition: 0.2s; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>

<div class="app">
    <h1>Climate Daily Summary</h1>
    <div id="status">ตรวจสอบพบข้อมูลในระบบแล้ว</div>

    <div class="panel">
        <label>เลือกวันที่: </label>
        <input type="date" id="targetDate">
        <button onclick="processDailyData()">แสดงผล</button>
    </div>

    <div class="stats">
        <div class="box"><div>อุณหภูมิเฉลี่ย</div><div id="temp" class="value">-</div></div>
        <div class="box"><div>ความชื้นเฉลี่ย</div><div id="humid" class="value">-</div></div>
        <div class="box"><div>VPD เฉลี่ย</div><div id="vpd" class="value">-</div></div>
        <div class="box"><div>ปริมาณฝนรวม</div><div id="rain" class="value">-</div></div>
    </div>

    <div class="charts">
        <div class="chart-container"><canvas id="chartTemp"></canvas></div>
        <div class="chart-container"><canvas id="chartHumid"></canvas></div>
        <div class="chart-container"><canvas id="chartVpd"></canvas></div>
        <div class="chart-container"><canvas id="chartRain"></canvas></div>
    </div>
</div>

<script>
// --- ส่วนที่ต้องนำข้อมูลจากไฟล์ 2023, 2024, 2025 มาวางที่นี่ ---
// วางเฉพาะส่วนที่เป็น <tr>...</tr> ของทุกไฟล์รวมกันในเครื่องหมาย ``
const rawData = `
    <tr><td>2025-02-08 08:00</td><td>25.5</td><td>0.8</td><td>70</td><td>0.0</td></tr>
    <tr><td>2025-02-08 12:00</td><td>30.2</td><td>1.5</td><td>55</td><td>0.0</td></tr>
    <tr><td>2025-02-13 10:00</td><td>28.1</td><td>1.2</td><td>65</td><td>1.5</td></tr>
`; 
// -------------------------------------------------------

let db = [];
let charts = {};

function initData() {
    const parser = new DOMParser();
    const doc = parser.parseFromString(`<table>${rawData}</table>`, 'text/html');
    const rows = doc.querySelectorAll("tr");

    rows.forEach(tr => {
        const td = tr.querySelectorAll("td");
        if (td.length >= 5) {
            db.push({
                date: td[0].textContent.trim().split(" ")[0],
                temp: parseFloat(td[1].textContent) || 0,
                vpd: parseFloat(td[2].textContent) || 0,
                humid: parseFloat(td[3].textContent) || 0,
                rain: parseFloat(td[4].textContent) || 0
            });
        }
    });

    if (db.length > 0) {
        const dates = db.map(d => d.date).sort();
        const lastDate = dates[dates.length - 1];
        document.getElementById("targetDate").min = dates[0];
        document.getElementById("targetDate").max = lastDate;
        document.getElementById("targetDate").value = lastDate;
        document.getElementById("status").innerText = `พร้อมใช้งาน: ข้อมูลระหว่าง ${dates[0]} ถึง ${lastDate}`;
        processDailyData(); // แสดงผลวันล่าสุดทันทีที่เปิด
    } else {
        document.getElementById("status").innerText = "❌ ไม่พบข้อมูลในส่วน rawData";
        document.getElementById("status").style.color = "red";
    }
}

function processDailyData() {
    const target = document.getElementById("targetDate").value;
    const data = db.filter(d => d.date === target);

    if (data.length === 0) return alert("ไม่พบข้อมูลของวันที่เลือก");

    const avgTemp = (data.reduce((a, b) => a + b.temp, 0) / data.length).toFixed(1);
    const avgHumid = (data.reduce((a, b) => a + b.humid, 0) / data.length).toFixed(1);
    const avgVpd = (data.reduce((a, b) => a + b.vpd, 0) / data.length).toFixed(2);
    const sumRain = (data.reduce((a, b) => a + b.rain, 0)).toFixed(1);

    document.getElementById("temp").innerText = avgTemp + " °C";
    document.getElementById("humid").innerText = avgHumid + " %";
    document.getElementById("vpd").innerText = avgVpd + " kPa";
    document.getElementById("rain").innerText = sumRain + " mm";

    updateChart("chartTemp", "อุณหภูมิ (°C)", [avgTemp], "#f87171");
    updateChart("chartHumid", "ความชื้น (%)", [avgHumid], "#60a5fa");
    updateChart("chartVpd", "VPD (kPa)", [avgVpd], "#fbbf24");
    updateChart("chartRain", "ปริมาณฝน (mm)", [sumRain], "#34d399");
}

function updateChart(id, label, value, color) {
    const ctx = document.getElementById(id).getContext("2d");
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(ctx, {
        type: "bar",
        data: {
            labels: [label],
            datasets: [{ data: value, backgroundColor: color, borderRadius: 10 }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });
}

// รันฟังก์ชันเริ่มต้น
initData();
</script>

</body>
</html>
