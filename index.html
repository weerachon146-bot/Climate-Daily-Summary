<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Daily Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body{ font-family:sans-serif; background:#eef2ff; margin:0; padding:30px; display:flex; justify-content:center; }
        .app{ width:900px; background:white; padding:30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
        .panel{ margin-top:20px; background:#f8fafc; padding:15px; border-radius:12px; display:flex; gap:10px; align-items:center; border:1px solid #e2e8f0; }
        .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:15px; margin-top:20px; }
        .box{ background:#ffffff; padding:15px; border-radius:12px; text-align:center; border:1px solid #e2e8f0; }
        .value{ font-size:20px; font-weight:bold; color:#4f46e5; }
        button{ cursor:pointer; border:none; border-radius:8px; padding:10px 15px; font-weight:bold; background:#4f46e5; color:white; }
        #loadingStatus { color: #ef4444; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <h1>Climate Daily Summary</h1>
        <div id="loadingStatus">กำลังโหลดฐานข้อมูล...</div>
        
        <div class="panel">
            <label>เลือกวันที่:</label>
            <input type="date" id="targetDate">
            <button onclick="processDailyData()">แสดงผล</button>
            <button onclick="goToHourly()" style="background:#6366f1;">ดูรายชั่วโมง (new1.html)</button>
        </div>

        <div class="stats">
            <div class="box"><div>อุณหภูมิเฉลี่ย</div><div id="temp" class="value">-</div></div>
            <div class="box"><div>ความชื้นเฉลี่ย</div><div id="humid" class="value">-</div></div>
            <div class="box"><div>VPD เฉลี่ย</div><div id="vpd" class="value">-</div></div>
            <div class="box"><div>ปริมาณฝนรวม</div><div id="rain" class="value">-</div></div>
        </div>
        <div class="mt-8" style="height:300px;"><canvas id="mainChart"></canvas></div>
    </div>

    <script>
        let db = [];
        const files = ["data/2023.html", "data/2024.html", "data/2025.html", "data/2026.html"];

        window.onload = async function() {
            const status = document.getElementById("loadingStatus");
            // เพิ่ม Timestamp เพื่อล้าง Cache ของ GitHub
            const cacheBuster = "?v=" + new Date().getTime();
            
            for (const file of files) {
                try {
                    const res = await fetch(file + cacheBuster);
                    if (!res.ok) continue;
                    const text = await res.text();
                    parseDataRaw(text);
                } catch (e) { console.error("Error loading:", file); }
            }

            if (db.length > 0) {
                const dates = [...new Set(db.map(d => d.date))].sort();
                document.getElementById("targetDate").min = dates[0];
                document.getElementById("targetDate").max = dates[dates.length-1];
                document.getElementById("targetDate").value = dates[dates.length-1];
                status.innerText = "✅ โหลดข้อมูลสำเร็จแล้ว";
                status.style.color = "#22c55e";
            } else {
                status.innerText = "❌ ตรวจสอบไฟล์ใน data/ ข้อมูลข้างในอาจไม่ตรงรูปแบบ YYYY-MM-DD";
            }
        };

        // ใช้การอ่านค่าแบบ Raw Text เพื่อความแม่นยำสูงสุด
        function parseDataRaw(text) {
            const rows = text.match(/<tr>(.*?)<\/tr>/gs) || [];
            rows.forEach(row => {
                const cols = row.match(/<td>(.*?)<\/td>/g);
                if (cols && cols.length >= 5) {
                    const dateRaw = cols[0].replace(/<\/?td>/g, '').trim();
                    const dateMatch = dateRaw.match(/^\d{4}-\d{2}-\d{2}/);
                    if (dateMatch) {
                        db.push({
                            date: dateMatch[0],
                            temp: parseFloat(cols[1].replace(/<\/?td>/g, '')) || 0,
                            vpd: parseFloat(cols[2].replace(/<\/?td>/g, '')) || 0,
                            humid: parseFloat(cols[3].replace(/<\/?td>/g, '')) || 0,
                            rain: parseFloat(cols[4].replace(/<\/?td>/g, '')) || 0
                        });
                    }
                }
            });
        }

        function processDailyData() {
            const date = document.getElementById("targetDate").value;
            const data = db.filter(d => d.date === date);
            if (data.length === 0) { alert("ไม่มีข้อมูลสำหรับวันที่เลือก"); return; }

            const avg = (key) => (data.reduce((a, b) => a + b[key], 0) / data.length);
            document.getElementById("temp").innerText = avg('temp').toFixed(1) + " °C";
            document.getElementById("humid").innerText = avg('humid').toFixed(1) + " %";
            document.getElementById("vpd").innerText = avg('vpd').toFixed(2) + " kPa";
            document.getElementById("rain").innerText = (data.reduce((a, b) => a + b.rain, 0)).toFixed(1) + " mm";
        }

        function goToHourly() {
            const date = document.getElementById("targetDate").value;
            if (date) {
                localStorage.setItem("selectedTargetDate", date);
                window.location.href = "new1.html";
            }
        }
    </script>
</body>
</html>
