<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Hourly Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>body{background:#f1f5f9;}</style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 id="header" class="text-2xl font-bold text-slate-800">ข้อมูลรายชั่วโมง</h1>
            <button onclick="window.location.href='index.html'" class="bg-slate-800 text-white px-4 py-2 rounded-lg">กลับหน้าหลัก</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="chartContainer">
            <div class="bg-white p-4 rounded-xl shadow h-80"><canvas id="hTemp"></canvas></div>
            <div class="bg-white p-4 rounded-xl shadow h-80"><canvas id="hHum"></canvas></div>
            <div class="bg-white p-4 rounded-xl shadow h-80"><canvas id="hVpd"></canvas></div>
            <div class="bg-white p-4 rounded-xl shadow h-80"><canvas id="hRain"></canvas></div>
        </div>
    </div>

    <script>
        const selected = localStorage.getItem("selectedTargetDate");
        const files = ["data/2023.html", "data/2024.html", "data/2025.html", "data/2026.html"];
        let hourlyRecords = [];

        window.onload = async function() {
            if(!selected) return window.location.href='index.html';
            document.getElementById("header").innerText = "กราฟรายชั่วโมง: " + selected;
            const cb = "?v=" + new Date().getTime();

            for (const f of files) {
                try {
                    const res = await fetch(f + cb);
                    const text = await res.text();
                    const rows = text.match(/<tr>(.*?)<\/tr>/gs) || [];
                    rows.forEach(r => {
                        const c = r.match(/<td>(.*?)<\/td>/g);
                        if(c && c[0].includes(selected)) {
                            hourlyRecords.push({
                                time: c[0].replace(/<\/?td>/g, '').split(" ")[1] || "00:00",
                                temp: parseFloat(c[1].replace(/<\/?td>/g, '')),
                                vpd: parseFloat(c[2].replace(/<\/?td>/g, '')),
                                hum: parseFloat(c[3].replace(/<\/?td>/g, '')),
                                rain: parseFloat(c[4].replace(/<\/?td>/g, ''))
                            });
                        }
                    });
                } catch(e){}
            }
            hourlyRecords.sort((a,b) => a.time.localeCompare(b.time));
            render();
        };

        function render() {
            const labels = hourlyRecords.map(r => r.time);
            newChart("hTemp", "Temp (°C)", labels, hourlyRecords.map(r => r.temp), "#f97316");
            newChart("hHum", "Humid (%)", labels, hourlyRecords.map(r => r.hum), "#3b82f6");
            newChart("hVpd", "VPD (kPa)", labels, hourlyRecords.map(r => r.vpd), "#a855f7");
            newChart("hRain", "Rain (mm)", labels, hourlyRecords.map(r => r.rain), "#10b981", "bar");
        }

        function newChart(id, label, labels, data, color, type='line') {
            new Chart(document.getElementById(id), {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{ label: label, data: data, borderColor: color, backgroundColor: color+'33', fill: true }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
